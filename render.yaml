# Render Blueprint — безкоштовний деплой торгового бота (paper-режим).
#
# База даних зовнішня (Neon, безкоштовна), тому DATABASE_URL вводиться вручну
# при створенні (sync: false). Бот працює як web-сервіс; зовнішній безкоштовний
# пінгер (cron-job.org) періодично смикає /trading/run — це й будить free-сервіс,
# і запускає ітерацію торгівлі. Деталі — у docs/DEPLOY.md.
#
# ⚠️ Назву (name) зміни на свою унікальну перед створенням.

services:
  - type: web
    name: trader-mvp
    runtime: python
    plan: starter              # платний план (узгоджено з апгрейдом сервісу)
    branch: claude/trading-service-mvp-tcrrer
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app
    envVars:
      - key: DATABASE_URL          # ← встав connection string з Neon при деплої
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: TRADE_MODE
        value: paper               # БЕЗ ризику: віртуальні гроші на реальних цінах
      - key: TRADE_EXCHANGE
        value: kraken              # Binance блокує US-IP Render (451); Kraken працює зі США
      # КОНСЕРВАТИВНИЙ ПРОФІЛЬ (пріоритет — стабільність і 70%+ виграшних, рівна крива).
      # Лише ліквідні майори (менше «пилкових» альтів); авто-тюнінг валідує саме на BTC.
      - key: TRADE_SYMBOLS
        value: BTC/USDT,ETH/USDT
      - key: TRADE_TIMEFRAME
        value: 1h                  # вищий таймфрейм = менше шуму/хибних сигналів
      - key: TRADE_STRATEGY
        value: macd                # активніша за ema_rsi: входить на кожному кросовері MACD
      - key: TRADE_MARKET_TYPE
        value: spot                # БЕЗ плеча: нуль ліквідації, м'якша крива
      - key: TRADE_LEVERAGE
        value: "1"                 # без плеча (spot вимагає 1)
      - key: TRADE_PAPER_BALANCE
        value: "1000"
      - key: TRADE_RISK_PER_TRADE
        value: "0.02"              # 2% на угоду — помірний ризик, менші просадки
      - key: TRADE_MAX_DAILY_LOSS_PCT
        value: "0.06"              # денний стоп 6% — захист від серії програшів у боковику
      - key: TRADE_ATR_TP_MULT
        value: "1.5"               # вужчий тейк → вищий % виграшних (беремо прибуток швидше)
      - key: TRADE_NOTIFY
        value: "true"              # сповіщення про угоди в Telegram (потрібні TG_BOT_TOKEN/TG_CHAT_ID)
